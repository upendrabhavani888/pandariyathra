 if(names){const P=vehPeople(v);blocks.push({sub:'',table:{head:[{t:'#',r:true},{t:'Devotee'},{t:'Age / Sex'},{t:'Team Lead'}],rows:P.map((d,i)=>({cells:[String(i+1),d.name,`${d.age} / ${(d.gender||'')[0]||''}`,tName(d.team_lead_id)]}))}})}
 return drawReport({rh:25,title:`${v.name}: allocation sheet`,heading:`${yn(v.yatra)} · ${fmtD(today())}`,blocks})}
const sheetName=(v,ext)=>`${String(v.name).toLowerCase().replace(/[^a-z0-9]+/g,'-')}-sheet-${String(yn(v.yatra)).toLowerCase().replace(/[^a-z0-9]+/g,'-')}.${ext}`;
async function sheetFile(v,fmt,names){const c=vehSheet(v,names);return fmt==='png'?{blob:await toBlob(c,'image/png'),name:sheetName(v,'png'),type:'image/png'}:{blob:await makePdf(c),name:sheetName(v,'pdf'),type:'application/pdf'}}
function shareDialog(vid){const v=DB.vehicles.find(x=>x.id===vid);if(!v)return;const m=document.createElement('div');m.className='modal';
 const teams=Object.entries(v.alloc||{}).filter(([,n])=>n>0).map(([tid,n])=>({tid:+tid,n,name:tName(tid),phone:DB.teamLeads.find(x=>x.id===+tid)?.mobile||''})),
  people=[];
 const addP=(role,name,phone)=>{if(!phone)return;const k=waNum(phone),ex=people.find(p=>waNum(p.phone)===k);if(ex)ex.role+=' · '+role;else people.push({role,name,phone})};
 if(v.leader)addP('Bus Leader',v.leader,v.leaderPhone);teams.forEach(t0=>addP(`Team Lead (${t0.n} in this vehicle)`,t0.name,t0.phone));
 const can=typeof navigator!=='undefined'&&!!navigator.share;
 m.innerHTML=`<div style="max-width:560px"><h2>Share ${esc(v.name)}</h2><p class="hint" style="font-size:14px;margin:4px 0 12px">A one-page sheet with the vehicle, Bus Leader, Team Leads and counts. ${vUsed(v)?'':'<b style="color:var(--red)">Nobody is allocated to this vehicle yet.</b>'}</p>
 <div style="display:grid;gap:12px"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="seg" role="group" aria-label="Format"><button class="b sm mar" data-shf="pdf">PDF</button><button class="b sm gh" data-shf="png">Image</button></span>
  <label style="display:flex;gap:8px;align-items:center;font-weight:500;margin:0;cursor:pointer"><input type="checkbox" id="sh-names" checked style="width:20px;min-height:20px"> Include passenger names</label></div>
 <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="b pri" id="sh-dl">Download sheet</button>${can?'<button class="b mar" id="sh-native">Share…</button>':''}<button class="b gh" id="sh-copy">Copy message</button></div>
 <div class="hint" style="font-size:12px;margin:-4px 0 0">${can?'Share… sends the file straight to WhatsApp on your phone. ':''}On a computer, download the sheet, then attach it in the WhatsApp chat with the paperclip.</div>
 <div><label>Send on WhatsApp</label>${people.length?`<div style="display:grid;gap:6px">${people.map(p=>`<div style="display:flex;gap:8px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:6px 10px"><div style="flex:1;min-width:0"><b>${esc(p.name)}</b><div class="hint" style="margin:0;font-size:12px">${esc(p.role)} · ${esc(p.phone)}</div></div><a class="b sm" style="background:#25D366!important;color:#06361a!important;text-decoration:none;display:inline-flex;align-items:center" target="_blank" rel="noopener" href="${esc(waLink(p.phone,vehMessage(v,p.name)))}">WhatsApp</a></div>`).join('')}</div>`:'<p class="hint">Add a Bus Leader number, and make sure the Team Leads have mobile numbers, to message them from here.</p>'}
  <a class="b gh sm" style="margin-top:8px;text-decoration:none;display:inline-flex;align-items:center" target="_blank" rel="noopener" href="${esc(waLink('',vehMessage(v,'')))}">WhatsApp someone else…</a></div>
 <div class="em" id="sh-err"></div></div><div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="b gh" id="sh-close">Close</button></div></div>`;document.body.appendChild(m);
 let fmt='pdf';const names=()=>$('#sh-names',m).checked;
 m.addEventListener('click',async e=>{const f=e.target.closest('[data-shf]');if(f){fmt=f.dataset.shf;m.querySelectorAll('[data-shf]').forEach(b=>b.className='b sm '+(b.dataset.shf===fmt?'mar':'gh'));return}
  if(e.target.id==='sh-close'){m.remove();return}
  if(e.target.id==='sh-dl'){const b=e.target;b.disabled=true;b.textContent='Preparing…';try{const fl=await sheetFile(v,fmt,names());saveBlob(fl.blob,fl.name);toast('Sheet downloaded')}catch(err){$('#sh-err',m).textContent='Could not create the sheet: '+err.message}b.disabled=false;b.textContent='Download sheet';return}
  if(e.target.id==='sh-native'){try{const fl=await sheetFile(v,fmt,names()),file=new File([fl.blob],fl.name,{type:fl.type});if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:`${v.name} sheet`,text:vehMessage(v,'')});else $('#sh-err',m).textContent='This browser cannot share files directly. Use Download sheet and attach it in WhatsApp.'}catch(err){if(err&&err.name!=='AbortError')$('#sh-err',m).textContent='Could not share: '+err.message}return}
  if(e.target.id==='sh-copy'){const txt=vehMessage(v,'');try{await navigator.clipboard.writeText(txt)}catch{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch{}ta.remove()}toast('Message copied');return}});
}
document.addEventListener('click',async e=>{const s=e.target.closest('[data-alshare]');if(s){shareDialog(+s.dataset.alshare);return}
 if(e.target.id==='al-allpdf'){const b=e.target,old=b.textContent;b.disabled=true;b.textContent='Preparing…';try{const vs=vehList(+CUR),cv=vs.map(v=>vehSheet(v,true));saveBlob(await makePdf(cv),`vehicle-sheets-${String(yn(+CUR)).toLowerCase().replace(/[^a-z0-9]+/g,'-')}.pdf`);toast(`${vs.length} vehicle sheet${vs.length===1?'':'s'} downloaded`)}catch(err){toast('Could not create the file: '+err.message,1)}b.disabled=false;b.textContent=old}});
const GUIDE=[
{id:'start',title:'Quick start: your first yatra',html:`<p>New to the app? Do these steps in order. Each takes a few minutes, and you can come back to any of them later.</p>
<ol>
<li><b>Create the yatra.</b> Give it a name, the destination (Puri, Pandharpur, Ayodhya, Brindavan, Dwaraka…) and the dates. <a data-goto="tools:yatras">Tools → Yatras</a></li>
<li><b>Add your Team Leads</b> with their 10-digit mobile numbers. <a data-goto="tools:team">Tools → Team</a></li>
<li><b>Fill in the lists:</b> train numbers and boarding stations, airlines and airports, lodges, darshan types and darshan slots. <a data-goto="tools:train">Train</a> <a data-goto="tools:flight">Flight</a> <a data-goto="tools:stay">Stay and darshan</a></li>
<li><b>Add the devotees.</b> Three ways: one at a time <a data-goto="form">Add devotee</a>, from a ticket (one upload can create a record for every passenger), or many at once from Excel or CSV <a data-goto="tools:bulk">Bulk upload</a>.</li>
<li><b>Allocate buses and rooms.</b> <a data-goto="alloc:bus">Bus Allocation</a> <a data-goto="alloc:room">Room Allocation</a></li>
<li><b>Plan food</b> for each train, and the <b>Complimentary Gift</b> once for the yatra. <a data-goto="dist:plan">Distribution → Train wise plan</a></li>
<li><b>Write the instructions</b> (general instructions, Dos and Don'ts) and the <b>Yatra Announcement</b> PDF. <a data-goto="instructions">Tools → Instructions</a></li>
<li><b>Share:</b> vehicle sheets and volunteer lists on WhatsApp, reports as PDF or Excel.</li>
<li><b>Back up.</b> Download a copy of the whole site with your data. <a data-goto="tools:brand">Tools → Logo and backup</a></li>
</ol><div class="tip"><b>Your data is saved automatically in this browser.</b> Nothing is sent anywhere. Because of that, take a backup (step 9) now and then, and read "Your data, backup and privacy" below.</div>`},
{id:'signin',title:'Signing in, profiles and field access',html:`<p>The portal opens on a <b>sign-in page</b>. The first time, you create the <b>Admin</b> account and receive a <b>recovery code</b>.${PY_SERVER?' On a new server you also type the <b>setup code</b> that the server prints when it first starts.':''} Write the code down: if the Admin forgets the password, <b>Forgot password</b> on the sign-in page accepts that code and lets you choose a new one. A new code is then shown.</p>
<h4>The three profiles</h4><ul><li><b>Admin:</b> uses every function and manages users in <a data-goto="users">User settings</a> (the round profile icon at the top right).</li><li><b>Creator:</b> a starting point that can add and change records and use allocation, distribution, instructions and the Team, Train and Volunteers lists. It does not include Manage Yatras, Logo and backup or Tickets and data.</li><li><b>Viewer:</b> a starting point that can only look. It can search, filter, open records, download, print and share, but cannot add, change or delete anything.</li></ul>
<h4>Choosing access by function (Admin)</h4><ol><li>Click your <b>profile icon</b> at the top right, choose <b>User settings</b> and press <b>+ Add user</b>. Give a name, a username and a temporary password. The person must choose their own password the first time they sign in.</li><li>Pick the person in the list. For a Creator or Viewer, the editor shows <b>Available functions</b> on the left: Master List and devotee details, Ticket details, Govt ID numbers, Cancelled list, each Report, Distribution, Bus Allocation, Room Allocation, Instructions, Yatra Announcement, Trains, the Tools lists, Bulk upload, Manage Yatras, Logo and backup, Tickets and data, and the User Guide.</li><li>In the <b>Easy list</b>, press <b>No access</b>, <b>View</b> (they can only look) or <b>Change</b> (they can use it fully) next to each function. The <b>Set all</b> buttons at the top of a group, and <b>Everything: view</b> and the other buttons above the list, do many at once. Prefer dragging? Choose <b>Drag and drop</b> and move functions between the three boxes. Reports and the User Guide can only be viewed, and Viewers cannot be given change access.</li><li>The person's menu then shows only what they can use. For example, someone with only <b>Bus Allocation</b> sees Allocation with just the Bus tab, and can change it.</li></ol>
<p>Functions group some details: <b>Master List and devotee details</b> covers the devotee fields, <b>Ticket details</b> covers the onward, return and additional tickets, and <b>Govt ID numbers</b> covers the ID type and number. Leave a group out and those columns and form fields disappear for that person (searching and downloads too). Reports show counts and lists on their own, so a person can have a report without seeing the Master List.</p>
<h4>Good to know</h4><ul><li><b>Sign in as</b> (on each person in User settings) lets you see the portal exactly as that person does, with only their menus and access, so you can check what you gave them. A banner shows who you are acting as, and <b>Back to my Admin account</b> returns you to User settings. While acting as someone you cannot change their password or open User settings.</li><li><b>Switch off</b> stops someone signing in without deleting them. <b>Reset password</b> gives a new temporary password. You cannot delete, switch off or demote yourself, and there must always be one active Admin.</li><li>After 5 wrong passwords, sign-in waits one minute. You are signed out after 60 minutes of no activity, and when you close the tab.</li>${PY_SERVER?'':'<li><b>Reset demo data</b> keeps the user accounts.</li>'}</ul>
${PY_SERVER?'<div class="warn"><b>Accounts and access are kept on the server.</b> Passwords are stored as salted hashes, the server checks what each person may see and change on every request, and Govt ID numbers are encrypted in its database. Backup files you download hold Govt ID numbers in clear text, so keep them safe.</div>':'<div class="warn"><b>This is a sign-in for this browser, not strong security.</b> The data is stored in the browser, so anyone who can open this browser\'s saved data, or a downloaded backup file (which also holds the accounts), can still read it. Keep backups safe. Real protection needs the server version.</div>'}`},
{id:'around',title:'Finding your way around',html:`<h4>The top bar</h4><p>The <b>Yatra</b> selector at the top right decides what you see everywhere: lists, reports, allocations and distributions all follow it. Choose <b>All yatras</b> to see everything together. A few pages, such as Allocation, Distribution plan and Instructions, need one yatra to be chosen. <b>Manage yatras</b> opens Tools.</p>
<h4>The tabs</h4><ul>
<li><b>Master List</b>: everyone in the yatra, with search and downloads.</li><li><b>Add devotee</b>: the form (it reads <b>Edit devotee</b> while you are editing someone).</li>
<li><b>Reports</b>: summary, Team Lead, travel, bus and room reports.</li><li><b>Distribution</b>: food and complimentary gifts, tracked team by team.</li>
<li><b>Allocation</b>: <b>Bus Allocation</b> and <b>Room Allocation</b>.</li><li><b>Cancelled</b>: people who cancelled, with the reason.</li><li><b>Tools</b>: everything else, in tabs: yatras, Team Leads, train lists, <b>Trains</b> (look a train up by its number), flights, volunteers, stay and darshan, <b>Instructions</b> and the Yatra Announcement, bulk upload, logo and backup, data, and this <b>User Guide</b>.</li></ul>
<h4>The theme follows the yatra</h4><p>Each destination has its own look: <b>Puri</b> black, red and yellow with the Nila Chakra; <b>Pandari</b> indigo and saffron with the Vitthal tilak; <b>Ayodhya</b> deep saffron with the sun; <b>Brindavan</b> peacock teal with the feather; <b>Dwaraka</b> ocean blue with the sun and moon. <b>All yatras</b> uses the original saffron look. You can change a yatra's theme in <a data-goto="tools:yatras">Tools → Yatras</a>.</p>
<h4>Buttons</h4><p>The yellow or saffron button is the main action on a page. White buttons are secondary. Red text means delete or cancel.</p>`},
{id:'yatras',title:'Yatras: create, copy, theme',html:`<p>A yatra is one trip. Devotees, tickets, rooms, buses, distributions and instructions all belong to a yatra.</p>
<h4>Creating one</h4><ol><li>Open <a data-goto="tools:yatras">Tools → Yatras</a> and fill in <b>name</b>, <b>destination</b>, <b>start</b> and <b>end</b> dates.</li>
<li><b>ID code</b> is optional. If you leave it blank it is made from the destination, for example PAN for Pandharpur or PUR for Puri. Yatra IDs look like <code>PY-2026-PAN-0001</code>.</li>
<li><b>Theme</b>: leave it on Auto and the destination chooses it.</li><li>Press <b>Create yatra</b>.</li></ol>
<h4>Starting from an earlier yatra</h4><p><b>Start from</b> copies the lodges, darshan types and the instructions of another yatra. Tick <b>Also copy that yatra's devotees</b> to bring returning pilgrims over: name, age, gender, Team Lead and Govt ID come across, while tickets, room, bus and darshan start blank, and everyone gets a new Yatra ID.</p>
<h4>Good to know</h4><ul><li>Yatra IDs are numbered within each yatra and <b>are never reused</b>, even after a devotee is deleted.</li><li>Changing the ID code of a yatra that already has devotees renames all their IDs, after asking you to confirm. The numbers stay the same.</li>
<li>You can only delete a yatra that has <b>no devotees</b>, and you can't delete the last yatra.</li></ul>`},
{id:'master',title:'Master List',html:`<p>Everyone in the selected yatra, one row each. Cancelled devotees are not shown here (see <b>Cancelled</b>).</p>
<ul><li><b>Search</b> looks in every column. Press <kbd>/</kbd> to jump to the search box from anywhere.</li><li><b>Click a row</b> to open that devotee for editing. On a phone each person is a card; tap it.</li>
<li><b>Views:</b> <b>Compact</b> shows tickets and stay in a few stacked columns, <b>By section</b> splits the details into Devotee, Onward, Return and Stay, and <b>All columns</b> shows everything and scrolls sideways.</li>
<li><b>Govt ID numbers are masked</b>: only the last four characters show.</li>
<li><b>+ Add devotee</b> opens the form. A small <b>test</b> tag marks dummy devotees created from Tools → Tickets and data.</li></ul>
<h4>Download list</h4><p>Press <b>Download list</b>, choose <b>Excel</b>, <b>CSV</b> or <b>PDF</b>, and either <b>All fields</b> or <b>Selected fields</b> (tick the columns you want, or press <b>Same as Master List</b>). The file contains the people currently shown, so your search and the selected yatra both apply. Govt ID numbers stay masked.</p>`},
{id:'add',title:'Adding a devotee',html:`<p>Open <a data-goto="form">Add devotee</a>. The form has sections, and a <b>Jump to</b> row at the top takes you straight to Devotee, Onward, Return, Additional or Stay.</p>
<h4>1. Devotee details</h4><p>Choose the <b>Team Lead</b> (their mobile number fills in by itself), then the <b>name</b>, <b>age</b> and <b>gender</b>. The Yatra ID is given when you save.</p>
<h4>2. Tickets</h4><p>There are sections for <b>Onward</b> and <b>Return</b>, and <b>+ Add another ticket</b> for any others. Each ticket is a <b>Train</b>, a <b>Flight</b>, or <b>On their own</b>.</p>
<ul><li><b>Upload a ticket:</b> press <b>Upload IRCTC or Flight Ticket</b>, <b>Take photo</b>, or drop a PDF, JPG or PNG onto the box. The app works out train or flight and fills in the PNR, train or flight number, date, boarding station and seat. <b>Fields it filled are shaded yellow, so check them.</b></li>
<li><b>Several passengers on one ticket?</b> A list appears. Pick which passenger is this devotee, or press <b>Create devotee records for all passengers</b> to make one record per passenger, each with their own coach, seat and berth. (Flight tickets may ask you for each person's age and sex.)</li>
<li><b>Ticket not read well?</b> Open <b>Show text read from the PDF</b> under the passengers to see what the reader saw, or type the details by hand. Text-based IRCTC PDFs work best. For photos and unusual layouts you can switch on Claude reading in <a data-goto="tools:data">Tools → Tickets and data</a>.</li>
<li><b>On their own:</b> for someone driving or booking separately. Choose how they travel, the date, approximate time and place, and add a note. They are not counted as "ticket missing".</li></ul>
<h4>3. Govt ID</h4><p>Choose the type (Aadhaar, Voter ID, PAN, Driving License or Passport) and type the number. It is checked against that type's format.</p>
<h4>4. Stay and logistics</h4><p>Lodge, room number, bus number, darshan type and darshan slot. You can leave these blank and fill them through <b>Allocation</b> later.</p>
<h4>Saving</h4><ul><li>If the same name, age and Team Lead already exist, the app asks whether to <b>update the existing record</b>, create a separate one, or go back.</li><li>A <b>seat clash</b> warning appears if someone else in the yatra has the same coach and seat on the same train and date.</li>
<li>If something is wrong, a red box at the top lists each problem. Tap an item to jump to that field.</li><li>Leaving the form with unsaved changes asks you first.</li></ul>`},
{id:'cancel',title:'Cancelling and restoring a devotee',html:`<ol><li>Open the devotee and press <b>Cancel devotee</b>.</li><li>Choose a reason (Health, Family reason, Work, Travel plans changed, Ticket cancelled, Did not turn up, or Other), the date, and an optional note.</li></ol>
<p>A cancelled devotee <b>keeps their Yatra ID and record</b>, but is left out of the Master List, reports, seat checks, bus and room allocation and distribution counts. The <a data-goto="cancelled">Cancelled</a> tab lists them with the reason and their PNRs and can be searched and downloaded. Press <b>Restore</b> to bring someone back; their history is kept as a note.</p>`},
{id:'bulk',title:'Bulk upload from Excel or CSV',html:`<p>Add many records at once in <a data-goto="tools:bulk">Tools → Bulk upload</a>. You can upload <b>Devotees</b>, <b>Team Leads</b>, <b>Volunteers</b> or <b>Train Leaders</b>.</p>
<ol><li><b>Get the template.</b> Choose what to upload, then download the Excel or CSV template. The first row must be the column headings, and columns marked * are required. The two sample rows are fake, so delete them.</li>
<li><b>Fill it in</b>, one row per person. Dates can be written like 14/11/2026 or 14 Nov 2026.</li>
<li><b>Upload your file.</b> Excel (.xlsx) and CSV work. Old .xls files need to be saved as .xlsx first.</li>
<li><b>Match your columns.</b> Your file does not need to use our headings. We pre-match the columns we recognise. Our fields are listed on the left, and on the right you choose which column of your file holds that information (or "Not in my file"). Required fields marked * must be matched. Your choices are remembered for files with the same headings, and <b>Match automatically again</b> starts over.</li>
<li><b>Check.</b> Every row is checked with the same rules as the devotee form. You see how many rows are ready, have warnings, are already in the list, or have problems, with the reason for each problem. Press <b>Fix</b> beside a problem row to correct it right on the screen, and it is checked again at once; <b>Leave this row out</b> skips it. Or <b>download the problem rows</b> to fix them in a spreadsheet.</li>
<li><b>Import.</b> Only the good rows are added. People already in the list are skipped unless you choose otherwise.</li></ol>
<h4>Things to know</h4><ul><li><b>Blanks are fine.</b> Only the <b>Name</b> is needed. A row with no name is ignored (not a problem), and a blank Age, Gender, Team Lead, Mobile or ticket cell is simply left blank, so you can fill it in later. Cells holding only <code>-</code> or <code>NA</code> count as blank. A cell with a wrong value (such as an age of "abc") is still flagged.</li>
<li>Write the <b>Team Lead</b> exactly as in your list. Team Leads in your file that are not in your list yet appear in a <b>Team Leads to add</b> box with a mobile field each (filled in from a <b>Team Lead Mobile</b> column if you have one). They are added <b>first</b>, then the devotees, so you don't need to upload Team Leads separately. A mobile number is optional; add it later in Tools, Team if you don't have it yet.</li>
<li>Numbers that Excel has already <b>rounded</b> (like <code>8.09848E+09</code>) cannot be recovered. Format that column as <b>Text</b>, type the numbers again and save the file. Whole numbers shown with <code>.0</code> are read correctly.</li><li>You can choose a <b>default Team Lead</b> for rows where the column is blank, and the <b>yatra</b> to import into.</li>
<li>New lodges, darshan types, stations and trains found in the file are added to your lists. The preview tells you which.</li><li>For flights, set <b>Mode</b> to Flight and write the number like <code>6E 2045</code>.</li>
<li><b>Undo that import</b> removes the people (and any new Team Leads) from the last import. Lists that grew stay as they are.</li></ul>`},
{id:'reports',title:'Reports',html:`<p>Open <a data-goto="reports">Reports</a>. Every report follows the selected yatra.</p>
<ul><li><b>Summary:</b> cards for devotees, cancelled, onward and return tickets in, and how many have <b>no room</b>, <b>no bus</b>, <b>darshan not booked</b> or <b>no Govt ID</b>, plus count tables by Team Lead, darshan, accommodation and bus.</li>
<li><b>Team Lead Report:</b> a count table (with mobile numbers) and a detail table with men, women, tickets in or pending, bus, room and "travelling on their own". You can search and pick one Team Lead.</li>
<li><b>Onward, Return and Additional travel:</b> switch between <b>Train</b>, <b>Flight</b> and <b>On their own</b>, and filter by date. You get the count by train or flight, by boarding station, and a collapsible list by coach and seat with names.</li>
<li><b>Bus Wise</b> shows the people on each bus with the Bus Leader and number. <b>Room Wise</b> shows each lodge (rooms and devotees) and <b>By Team</b>: each lodge with the Team Leads staying in it, how many people, and their room numbers. Both fill in when you press <b>Apply to Master List</b> in Allocation.</li></ul>
<p>Each report has <b>Download CSV</b> and <b>Print</b>, and each table has <b>Image</b>, <b>PDF</b> and <b>WhatsApp</b> buttons. <b>WhatsApp</b> shows a preview of the picture, a message you can edit, and a list to send it to. By default your message is printed on the picture, so the picture and the text always arrive together. On a phone <b>Share to WhatsApp</b> sends it straight in; on a computer <b>Copy picture &amp; open WhatsApp</b> copies the picture and opens WhatsApp, and you paste it into the chat.</p>`},
{id:'dist',title:'Distribution: food and complimentary gifts',html:`<p>Open <a data-goto="dist">Distribution</a>. It tracks <b>Breakfast, Lunch, Dinner and Snacks</b> and a <b>Complimentary Gift</b>, team by team.</p>
<h4>Plan the trains</h4><ol><li>Go to <a data-goto="dist:plan">Train wise plan</a>. Each train and date is its own journey, showing the passengers per Team Lead, the coaches, the boarding stations, how many packets to arrange, and the Train Leader.</li>
<li>Tick the meals for that journey and press <b>Create plan for ticked items</b>. Anything already planned shows as locked with its progress. The little <b>×</b> removes a plan.</li></ol>
<h4>The Complimentary Gift (once for the whole yatra)</h4><p>The gift is not planned per train. At the top of the <b>Train wise plan</b> tab, press <b>Plan the Complimentary Gift</b> (or use <b>+ Add distribution</b> and choose Complimentary Gift). It covers every devotee in the yatra and is tracked team by team like the meals. You can plan it once per yatra.</p>
<h4>Track the handing out</h4><p>Open a distribution in the <a data-goto="dist:track">Tracker</a>. Each Team Lead is listed with their <b>total count</b> (how many people they have in this distribution) and a <b>Status</b>: <b>Pending</b> or <b>Distributed</b>, plus an optional note. Mark a team <b>Distributed</b> once its whole group has been given the food or gift. The number at the top adds up the counts of the teams marked Distributed. Changes save as you make them.</p>
<ul><li><b>Mark all teams as…</b> updates everyone at once.</li><li>Set the <b>time</b>, a note, and a <b>Volunteer in charge</b> for the whole distribution.</li><li>On a train, <b>By coach</b> shows how many people are in each coach, for walking the train.</li>
<li><b>Download CSV</b>, <b>Print</b> and <b>Delete</b> are on each distribution. In the tracker you can delete one, or tick several and press <b>Delete selected</b>.</li></ul>
<p><b>+ Add distribution</b> sets up food at a venue or lodge (not on a train): choose the date, place and who it is for. Choose <b>Complimentary Gift</b> there to plan the yatra-wide gift.</p>`},
{id:'bus',title:'Allocation: buses, cars and TTs',html:`<p>Open <a data-goto="alloc:bus">Allocation → Bus Allocation</a>.</p>
<h4>Add the vehicles</h4><p>Press <b>+ Add vehicle</b>. Choose <b>Bus</b>, <b>Car</b> or <b>TT</b>, the seat capacity, a name, and optionally a registration or driver note. <b>How many</b> adds several identical vehicles at once (Bus 1, Bus 2, Bus 3…). Add the <b>Bus Leader</b> and their number: typing a Team Lead, volunteer or Train Leader name fills the number in.</p>
<h4>Put people in vehicles</h4><ul><li><b>Drag and drop:</b> drag a Team Lead card into a vehicle. If the vehicle has fewer free seats than the team needs, it fills what it can and tells you how many are left. Drag a name between vehicles, or back onto the Team Leads panel to remove it. On a phone, use the <b>⠿</b> handle, or press <b>Assign…</b>.</li>
<li><b>Fine-tune</b> with the − and + buttons on each Team Lead inside a vehicle.</li><li><b>Auto allocate…</b> can keep each team together (the biggest teams first, split only when needed) or fill vehicles in order. It can keep your manual placements or start again.</li></ul>
<p>The top shows seats, who is seated and who is not, and how many more vehicles you would need.</p>
<h4>Finish and share</h4><ul><li><b>Apply to Master List</b> writes each person's bus into the Bus No column, so the Bus Wise report fills in. It asks first.</li>
<li><b>Share</b> on a vehicle makes a one-page sheet (PDF or image) with the Bus Leader, Team Leads and optionally passenger names, and opens WhatsApp for the Bus Leader and each Team Lead. <b>All vehicle sheets (PDF)</b> makes one PDF of every vehicle.</li><li><b>Download CSV</b> and <b>Print</b> are at the top.</li></ul>`},
{id:'room',title:'Allocation: rooms',html:`<p>Open <a data-goto="alloc:room">Allocation → Room Allocation</a>.</p>
<h4>Add the rooms</h4><p>Press <b>+ Add rooms</b>. Choose the lodge (or add a new one), type the room numbers as ranges and numbers, like <code>101-110, 201, 203</code>, and the number of beds in each. A line shows exactly which rooms will be created. If the Master List already has lodge and room numbers, <b>Read rooms from the Master List</b> turns them into rooms.</p>
<h4>Put people in rooms</h4><ul><li><b>Drag a Team Lead</b> into a room and the room fills with the people who fit. <b>People</b> on a Team Lead lets you drag one person at a time. Drag someone between rooms, or back to the panel to remove them. Phones: use the <b>⠿</b> handle or <b>Assign…</b>.</li>
<li><b>Keep men and women in separate rooms</b> is on by default. A room becomes a men's or women's room from its first adult, and children aged 10 and under can stay in any room. Turn it off for families.</li>
<li><b>Auto allocate…</b> can keep each Team Lead's group together or fill rooms in order, and can keep your manual placements.</li></ul>
<p>When you are happy, press <b>Apply to Master List</b> to write each person's lodge and room number. The Room Wise report then shows the allocation. <b>Download CSV</b> and <b>Print</b> are at the top.</p>`},
{id:'instructions',title:'Instructions page',html:`<p>One page of instructions per yatra: general instructions, Dos and Don'ts, emergency contacts, anything the group should know. Open <a data-goto="instructions">Tools → Instructions</a>.</p>
<ul><li>Press <b>+ Add instructions</b> (or <b>Edit</b>). A live preview sits beside the text box.</li><li>Type <code># </code> and a title for a heading, <code>- </code> for a bullet, and <code>**word**</code> for bold. A heading with <b>Dos</b> turns green and one with <b>Don'ts</b> turns red.</li>
<li><b>Insert Dos and Don'ts template</b> adds a ready outline you can edit.</li><li>When saved you can <b>Copy text</b>, <b>Print</b>, or download an <b>Image</b> or <b>PDF</b> to send to devotees.</li></ul>
<p>A new yatra made with <b>Start from</b> copies another yatra's instructions. Volunteer messages can add them to the end (see below).</p>`},
{id:'trains',title:'Trains: look a train up by its number',html:`<p>Open <a data-goto="trains">Tools → Trains</a> and type a 5-digit train number. If you have saved that train, you see at once: its <b>name</b>, the <b>source</b> and <b>departure time</b>, the <b>destination for this yatra</b> (Solapur or Pandharpur for the Pandari yatra, depending on which one is on the train's route) with the <b>arrival time</b>, and the <b>full route</b> with the arrival and departure time at every stop.</p>
<ul><li><b>Enter details by hand</b> for a train you have not saved: type the name, then the stops in order with the arrival time, departure time and journey day (1, 2…) of each. The first stop is the source and the last is the final stop. Nothing is saved until you press <b>Save train</b>. <b>Edit</b> corrects it later.</li>
<li><b>Create from the announcement:</b> the trains already in your Yatra Announcement (number, name, source and departure, destination and arrival) are saved here for you. This happens by itself the first time you open Trains, and the button at the top does it again for any train that is in the announcement but not saved yet. It never changes a train you have already saved. Press <b>Edit</b> on a train to add the stops in between.</li>
<li><b>My trains</b> lists the trains whose timetable you have saved. <b>Remove all</b> clears them (the train numbers in Tools, Train list stay).</li>
<li>In the <b>Yatra Announcement</b>, typing a train number fills the train name, From, Dep time, To and Arrival time from the saved timetable (only boxes that are still empty). <b>Fill from my trains</b> does this for every row.</li></ul>
<div class="tip">Timetables change. A saved timetable is a copy of what you typed, so check it against IRCTC or NTES before each yatra.</div>`},
{id:'announce',title:'Yatra Announcement PDF',html:`<p>One PDF to announce the yatra to everyone. Open <a data-goto="instructions">Tools → Instructions</a> and choose the <b>Yatra Announcement</b> tab. It saves as you type, and a live preview shows exactly what the PDF will look like.</p>
<h4>What the PDF contains</h4><ol><li>A header with your top line (for example <i>By BhagavadKrupa and GuruKrupa</i>) and the title (for example <i>Pandari Yathra December 2026</i>), with your logo.</li><li>The opening line: <i>By GuruKrupa and Bhagavad Anugraham, this year Pandari Yathra December 2026 schedule as follows:</i></li>
<li>A table <b>Onward Journey to Solapur</b> with Sl#, Details, Date, Train#, Train name, From, Dep time, To and Arrival Time. Each row is a train planned for the yatra.</li><li>A <b>Schedule</b> shown as day-by-day cards, each with a timeline of times and programmes (optional).</li><li>A table <b>Return Journey from Solapur</b>.</li>
<li><b>Notes:</b> the IRCTC booking date of every onward and return train, the request to share booked tickets and the Yatri list with the volunteers by your deadline, and any notes of your own.</li><li>A closing line, such as <i>Radhe Radhe | Aum Tat Sat Sri Krushnarpanamastu</i>.</li></ol>
<h4>How to fill it in</h4><ul><li>The wording, destination and trains start filled in from the yatra: trains and boarding stations come from your devotees' tickets, the schedule from the darshan slots. <b>Fill from tickets</b> and <b>Fill from darshan slots</b> rebuild them at any time. Everything can be edited, and <b>+ Add train</b> adds rows by hand, so you can prepare it before any tickets exist.</li>
<li>Type the departure and arrival times for each train, or save the train in <a data-goto="trains">Trains</a> and they fill in by themselves. Choosing a train number also fills in its name. Every section and every train can be <b>collapsed</b> to a one-line summary and expanded again, and <b>Expand all</b> and <b>Collapse all</b> do it for a whole list.</li><li><b>IRCTC booking opens</b> is worked out as the journey date minus the number of days you set (60 at present). Set a date on a train to override it.</li>
<li>Pick the <b>deadline</b> for sharing tickets and the Yatri list; tick <b>Show the volunteers' names and numbers</b> to list their contacts under that note.</li><li><b>Download PDF</b> saves an A4 landscape PDF. <b>Share on WhatsApp</b> shares the PDF on a phone; on a computer it downloads the PDF and opens WhatsApp so you can attach it.</li></ul>
<div class="tip">A new yatra made with <b>Start from</b> keeps the wording of the old announcement but starts with empty trains and no deadline.</div>`},
{id:'volunteers',title:'Volunteers, Train Leaders and messages',html:`<p>Keep helpers in <a data-goto="tools:vol">Tools → Volunteers</a>.</p>
<ul><li><b>Volunteers:</b> name, mobile and an optional note such as "Food counter". <b>Train Leaders:</b> name, mobile and the train they lead (or Any train).</li>
<li>The ▲ ▼ buttons set the <b>order</b> of the list, and <b>Sort A–Z</b> puts it in alphabetical order.</li>
<li><b>Share list as one message</b> builds a single WhatsApp message with everyone's name and number in your order. Tick who to include, choose whether to show notes and +91, and edit the text before sending. <b>Send on WhatsApp</b> lets you pick any chat or group, and <b>Copy message</b> works anywhere.</li>
<li><b>Message</b> on one person sends them their own duties: for a volunteer, the distributions they are in charge of; for a Train Leader, the trains they lead. You can add the yatra's instructions to the end.</li></ul>
<p>Train Leaders appear on each train in the Distribution plan, and a volunteer can be set as <b>in charge</b> of a distribution.</p>`},
{id:'tools',title:'Tools: what each tab is for',html:`<ul>
<li><b>Yatras:</b> create, edit and delete yatras, set the theme. <b>Reset IDs</b> starts a yatra's ID numbers again from 0001 (if it already has devotees they are renumbered, oldest first, after you confirm).</li><li><b>Team:</b> Team Leads with their mobile numbers (each has one number, which fills in on the devotee form).</li>
<li><b>Train list:</b> train numbers (they fill the Train No dropdown) and boarding stations. <b>Trains:</b> type a train number to see its name, source, departure, arrival at the yatra destination and the full route. <b>Flight:</b> airlines and airports.</li><li><b>Instructions:</b> the yatra's general instructions and Dos and Don'ts, and the Yatra Announcement PDF. <b>User Guide:</b> this guide.</li><li><b>Volunteers:</b> volunteers and Train Leaders, with messaging.</li>
<li><b>Stay and darshan:</b> for the selected yatra, the lodges, darshan types and darshan slots (date, start and end time), plus the shared list of "own travel" modes. Pick one yatra first.</li>
<li><b>Bulk upload:</b> import from Excel or CSV.</li><li><b>Logo and backup:</b> upload your logo (shown in the header and on downloads; blank space around it is trimmed away automatically), and <b>Download this site</b>.</li>
<li><b>Tickets and data:</b> <b>Quick export</b> (a CSV of the yatra), <b>Reset</b>, <b>Ticket reading</b> and <b>Test data</b>.</li></ul>
<h4>Ticket reading</h4>${PY_SERVER?'<p>The app reads text-based IRCTC PDFs by itself in your browser. For photos and unusual layouts the server can read them with Claude, if whoever runs the server has set that up. The ticket file is used only to read the details and is not stored.</p>':'<p>By default the app reads text-based IRCTC PDFs by itself in your browser. For photos and unusual layouts you can paste an Anthropic API key and the ticket is sent to Claude to read. Use a key you can cancel, for testing only.</p>'}
${PY_SERVER?'':'<h4>Test data</h4><p>Creates dummy devotees (400 by default, up to 1,500) so you can try out allocation and reports with a big group. They are marked <b>test</b>, and <b>Remove all dummy devotees</b> deletes only them. <b>Remove them before you start real work.</b></p>'}
${PY_SERVER?'':'<div class=\"warn\"><b>Reset demo data</b> wipes the devotees, yatras and lists saved in this browser and brings back the three sample devotees. The user accounts are kept. Only use it on purpose.</div>'}`},
{id:'share',title:'Sharing and downloading',html:`<div class="tw"><table style="width:100%"><thead><tr><th>What</th><th>Where</th><th>Formats</th></tr></thead><tbody>
<tr><td>Devotee list</td><td>Master List → Download list</td><td>Excel, CSV, PDF</td></tr>
<tr><td>Any report table</td><td>Reports → Image / PDF / WhatsApp on the table, Download CSV, Print</td><td>PNG, PDF, CSV, WhatsApp</td></tr>
<tr><td>Vehicle sheet</td><td>Allocation → Bus → Share</td><td>PDF, Image, WhatsApp message</td></tr>
<tr><td>Room list</td><td>Allocation → Room → Download CSV, Print</td><td>CSV</td></tr>
<tr><td>Distribution</td><td>Distribution → Download CSV, Print</td><td>CSV</td></tr>
<tr><td>Instructions</td><td>Instructions → Copy, Print, Image, PDF</td><td>Text, PNG, PDF</td></tr>
<tr><td>Volunteer list</td><td>Tools → Volunteers → Share list as one message</td><td>WhatsApp message</td></tr>
<tr><td>This guide</td><td>Tools → User Guide → Print guide</td><td>Print or save as PDF</td></tr></tbody></table></div>
<div class="tip">WhatsApp links can carry text but not files. On a computer, download the PDF or image first and attach it in the chat with the paperclip. On a phone, <b>Share…</b> (when shown) can send the file straight to WhatsApp. Very long messages can be cut off by WhatsApp; if so, use <b>Copy message</b> and paste it.</div>
<p>Downloaded images and PDFs carry the yatra's theme, and your logo if you uploaded one.</p>`},
{id:'data',title:'Your data, backup and privacy',html:`${PY_SERVER?`<ul><li><b>Where it lives:</b> on the server, in one shared database. Everyone who signs in sees the same data, and changes by other people appear on your screen within a few seconds. Nothing is kept in this browser except small settings such as your theme. Ticket files are never stored: they are read and discarded.</li><li><b>Saving:</b> each change is saved as you make it. The small <b>Saved / Saving / Offline</b> label at the top shows the state. If the connection drops, your changes stay on your screen and are sent when it is back.</li><li><b>Two people at once:</b> if two people change the same record at the same moment, the first save wins and the second person is told, so nobody overwrites someone else without knowing.</li><li><b>Back up:</b> the server makes its own copy of the database every night. As Admin you can also download a backup file or restore one in <a data-goto="tools:brand">Tools → Logo and backup</a>. The same file format is used by the standalone demo, so it can bring a demo's data in.</li><li><b>Govt ID numbers</b> are encrypted in the database, masked on screen and in downloads, and only sent to people whose profile includes the Govt ID numbers function.</li><li><b>Activity log:</b> an Admin can see who did what and when from the profile menu. It never records Govt ID numbers, passwords or ticket files.</li></ul>`:`<ul><li><b>Where it lives:</b> in the browser you are using, on this device. There is no server, so nothing leaves your device except messages you choose to send, and ticket reading by Claude if you switch it on.</li>
<li><b>It is per browser.</b> A different browser, another device, a private window, or clearing the site's data starts empty.</li>
<li><b>Back up:</b> <a data-goto="tools:brand">Tools → Logo and backup</a> has <b>Download site with data</b>, which saves one HTML file containing the whole app and your data (open it in any browser to carry on), and <b>Download data only (.json)</b>, a small file you can bring back with <b>Restore from a data file</b>. In Chrome and Edge a Save window lets you choose where the file goes. File names include the date and time, so <b>always open the newest one</b>. Neither includes ticket files you uploaded or your Claude API key.</li>
<li><b>Opening a backup:</b> in a browser with no data it loads automatically. If the browser already has data, you are asked to <b>Load the saved data</b> (replaces what is there) or <b>Keep this browser's data</b>.</li>
<li><b>Govt ID numbers</b> are masked on screen and in downloads (only the last four characters show).</li></ul>
<div class="tip"><b>Good habit:</b> download a fresh backup after each big session, and name the file with the date.</div>`}`},
{id:'phone',title:'Using it on a phone',html:`<p>Every page works on a phone.</p>
<ul><li>The menu scrolls sideways; the yatra selector sits under it.</li><li>Lists become cards, and wide tables scroll inside their own box.</li>
<li><b>Drag and drop</b> works by touch from the <b>⠿</b> handle on a card, so the page still scrolls normally when you touch anywhere else. Every drag also has an <b>Assign…</b> button.</li>
<li>Phone numbers are tappable to call, and the WhatsApp buttons open WhatsApp.</li><li>On a phone, <b>Take photo</b> in the ticket section opens the camera.</li></ul>`},
{id:'tips',title:'Shortcuts and handy tips',html:`<ul><li><kbd>/</kbd> jumps to the search box on the Master List, the Team Lead report, Cancelled and this guide.</li><li><kbd>Esc</kbd> closes a dialog.</li>
<li>Most lists remember your choice: the Master List view, the last Tools tab, and the last Allocation tab.</li><li>Press the small <b>×</b> next to a list item in Tools to remove it.</li>
<li>Tap a phone number to call; tap <b>Message</b> to send a WhatsApp message.</li><li>A yellow shade on a form field means it was read from an uploaded ticket.</li></ul>`},
{id:'help',title:'Problems and answers',html:`<h4>My data is gone</h4><p>Data is saved per browser. If you are on another browser or device, or the site data was cleared, open your backup file and choose <b>Load the saved data</b>.</p>
<h4>The ticket did not fill in</h4><p>The built-in reader needs a text-based PDF. Open <b>Show text read from the PDF</b> to see what it found. For photos, switch on Claude reading in <a data-goto="tools:data">Tools → Tickets and data</a>, or type the details in.</p>
<h4>I can't choose a Team Lead</h4><p>Add them in <a data-goto="tools:team">Tools → Team</a> first.</p>
<h4>Bulk upload says the Team Lead is not in the list</h4><p>Type the name exactly as in your list, or add the <b>Team Lead Mobile</b> in that row so the app can create them.</p>
<h4>I can't delete a yatra</h4><p>A yatra can only be deleted when it has no devotees, and the last yatra can't be deleted.</p>
<h4>"Seat clash" warning</h4><p>Two people have the same coach and seat on the same train and date. Check the tickets of both. The warning does not stop you saving.</p>
<h4>Bus Allocation says "Short by … seats"</h4><p>There are more devotees than seats. Add another vehicle, or use <b>How many</b> to add several.</p>
<h4>A room shows "Mixed"</h4><p>It has adults of both genders. That is normal for families: turn off <b>Keep men and women in separate rooms</b> if you want to allow it.</p>
<h4>The Master List does not show a bus or room I allocated</h4><p>Press <b>Apply to Master List</b> in the Allocation tab. Until then the allocation is only on that page.</p>
<h4>Colours changed when I switched yatra</h4><p>That is the theme following the destination. Change it in <a data-goto="tools:yatras">Tools → Yatras</a> if you prefer another.</p>
<h4>Drag and drop does not work on my phone</h4><p>Drag from the <b>⠿</b> handle, or press <b>Assign…</b>.</p>`}
];
GUIDE.forEach(s=>{s.text=(s.title+' '+s.html).replace(/<[^>]+>/g,' ').replace(/&[a-z]+;/g,' ').replace(/\s+/g,' ').toLowerCase()});
let GQ='',GOPEN=new Set(['start']);
function guideHl(html,q){if(!q)return html;const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');return html.replace(/>([^<>]+)</g,(m,tx)=>'>'+tx.replace(re,x=>`<mark>${x}</mark>`)+'<')}
function vGuide(){const q=GQ.trim().toLowerCase(),list=GUIDE.filter(s=>!q||s.text.includes(q)),all=GUIDE;
 const toc=`<aside class="guide-toc no-print" aria-label="Contents"><b>Contents</b>${all.map((s,i)=>`<a data-gjump="${s.id}" ${q&&!list.includes(s)?'style="opacity:.4"':''}>${i+1}. ${esc(s.title)}</a>`).join('')}</aside>`;
 const body=list.length?list.map(s=>{const i=GUIDE.indexOf(s),open=q?true:GOPEN.has(s.id);return `<details class="card" id="g-${s.id}" data-gid="${s.id}" ${open?'open':''}><summary><span class="gnum">${i+1}</span> ${esc(s.title)}</summary><div class="body gbody">${guideHl(s.html,q)}</div></details>`}).join(''):`<div class="card empty"><p>Nothing matches "${esc(GQ)}"</p><p class="hint" style="font-size:14px;margin-top:6px">Try a shorter word, like "room", "ticket" or "backup".</p><button class="b gh" id="gq-clear" style="margin-top:12px">Clear search</button></div>`;
 return `<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start;margin-bottom:12px"><div><h2>User Guide</h2><div class="hint" style="font-size:13px">How to use this app, step by step. Press <kbd>/</kbd> to search.</div></div>
  <div class="no-print" style="display:flex;gap:8px;flex-wrap:wrap"><button class="b gh sm" id="g-open">Expand all</button><button class="b gh sm" id="g-close">Collapse all</button><button class="b gh sm" id="g-print">Print guide</button></div></div>
  <input id="gq" type="search" class="no-print" placeholder="Search the guide  (try: ticket, room, backup, WhatsApp)" value="${esc(GQ)}" style="max-width:none;margin-bottom:12px" aria-label="Search the guide">
  ${q?`<p class="hint no-print" style="margin:-4px 0 10px">${list.length} of ${all.length} sections match.</p>`:''}
  <div class="guide-wrap">${toc}<div>${narrow()?`<details class="card no-print" style="margin-bottom:10px"><summary>Contents</summary><div class="body" style="display:grid;gap:2px">${all.map((s,i)=>`<a href="#" data-gjump="${s.id}" style="padding:9px 4px;color:var(--kum2);font-weight:600">${i+1}. ${esc(s.title)}</a>`).join('')}</div></details>`:''}${body}</div></div>`}
function guideGo(spec){let[v,sub]=spec.split(':');if(v==='users'||(v==='tools'&&sub==='users')){if(!isAdmin()){toast('Only an Admin can open User settings',1);return}VIEW='users';render();scrollTo(0,0);return}if(v==='instructions'){v='tools';sub='ins'}else if(v==='trains'){v='tools';sub='trains'}else if(v==='guide'){v='tools';sub='guide'}if(v==='tools'&&sub){TT=sub;localStorage.setItem('py_tt',TT)}if(v==='alloc'&&sub){ALT=sub;localStorage.setItem('py_alt',ALT)}if(v==='dist'&&sub)DT=sub;
 const b=document.querySelector(`#nav [data-nav="${v}"]`);if(b)b.click();scrollTo(0,0)}
document.addEventListener('click',e=>{const t=e.target;let a;
 if(a=t.closest('[data-goto]')){e.preventDefault();guideGo(a.dataset.goto);return}
 if(a=t.closest('[data-gjump]')){e.preventDefault();const id=a.dataset.gjump;GQ='';GOPEN.add(id);render();const el=$('#g-'+id);if(el){el.open=true;el.scrollIntoView({block:'start',behavior:'smooth'})}return}
 if(t.id==='g-open'){GUIDE.forEach(s=>GOPEN.add(s.id));render();return}if(t.id==='g-close'){GOPEN.clear();render();return}
 if(t.id==='gq-clear'){GQ='';render();return}
 if(t.id==='g-print'){document.querySelectorAll('details.card[data-gid]').forEach(d=>d.open=true);setTimeout(()=>window.print(),50);return}});
document.addEventListener('input',e=>{if(e.target.id==='gq'){GQ=e.target.value;const p=e.target.selectionStart;render();const q=$('#gq');q.focus();q.setSelectionRange(p,p)}});

 const lead=()=>{const q=Math.max(1,+($('#vh-qty',m)?.value)||1);['#vh-leader','#vh-lphone'].forEach(s=>$(s,m).disabled=q>1);$('#vh-lhint',m).style.display=q>1?'block':'none'};
 $('#vh-leader',m).addEventListener('input',()=>{const x=findPerson($('#vh-leader',m).value);if(x&&!$('#vh-lphone',m).value.trim())$('#vh-lphone',m).value=x.mobile});
 const prev=()=>{lead();const el=$('#vh-prev',m);if(!el)return;const nm=$('#vh-name',m).value.trim(),q=Math.min(20,Math.max(1,+($('#vh-qty',m).value)||1));if(!nm){el.textContent='';return}

 $('#as-v',m).onchange=()=>{const v=DB.vehicles.find(x=>x.id===+$('#as-v',m).value);$('#as-n',m).value=Math.min(rem,v.cap-vUsed(v))};$('#as-no',m).onclick=()=>m.remove();

function autoDialog(){const yid=+CUR,vs=vehList(yid),counts=teamCounts(yid),total=[...counts.values()].reduce((a,b)=>a+b,0),seats=vs.reduce((a,v)=>a+v.cap,0),m=document.createElement('div');m.className='modal';

 $('#aa-mode',m).onchange=()=>{$('#aa-help',m).textContent=$('#aa-mode',m).value==='together'?'Biggest teams first, each into the vehicle where it fits best. A team is split only when no single vehicle has room.':'Teams in name order fill the first vehicle, then the next, and so on. Teams may be split across vehicles.'};

function allocDrop(info,vid){const v=DB.vehicles.find(x=>x.id===vid);if(!v)return;const yid=v.yatra;v.alloc=v.alloc||{};const free=v.cap-vUsed(v);
 if(info.kind==='team'){const rem=(teamCounts(yid).get(info.tid)||0)-tAlloc(yid,info.tid);if(rem<=0){toast('Everyone in this team already has a seat',1);return}if(free<=0){toast(`${v.name} is full`,1);return}const k=Math.min(rem,free);v.alloc[info.tid]=(v.alloc[info.tid]||0)+k;save();toast(k<rem?`${k} of ${rem} from ${tName(info.tid)} placed in ${v.name}. ${rem-k} still need a seat`:`${tName(info.tid)} placed in ${v.name}`,k<rem)}

 render()}

function restoreData(file){const fr=new FileReader();fr.onerror=()=>toast('Could not read the file',1);fr.onload=()=>{let s;try{s=JSON.parse(fr.result)}catch{toast('This is not a Pandari Yathra data file',1);return}
 if(!s||s.app!=='pandari-yathra'||!s.data||!Array.isArray(s.data.devotees)||!Array.isArray(s.data.yatras)){toast('This is not a Pandari Yathra data file',1);return}
 const when=new Date(s.at).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
 ask('Replace the data in this browser?',`This file was saved on ${when} and holds ${s.data.devotees.length} devotee${s.data.devotees.length===1?'':'s'} and ${s.data.yatras.length} yatra${s.data.yatras.length===1?'':'s'}. Everything currently in this browser is replaced.`,'Restore',()=>{try{localStorage.setItem('py_demo',JSON.stringify(s.data));if(s.logo)localStorage.setItem('py_logo',s.logo);else localStorage.removeItem('py_logo');if(s.cur)localStorage.setItem('py_cur',s.cur)}catch(e){toast('The browser could not store this data: '+e.message,1);return}location.reload()})};fr.readAsText(file)}

document.addEventListener('input',e=>{const p=e.target.dataset?.p;if(!p)return;let v=e.target.value;
 const tm=p.match(/^t:([^:]+):(\w+)$/);if(tm){const t0=getT(isNaN(tm[1])?tm[1]:+tm[1]),k=tm[2],fl=t0?.mode==='flight';
  if(k==='train_no')v=v.replace(/\D/g,'');else if(k==='pnr'||k==='seat')v=fl?v.toUpperCase().replace(/[^A-Z0-9]/g,''):v.replace(/\D/g,'');else if(k==='flight_no')v=v.toUpperCase().replace(/[^A-Z0-9 ]/g,'');e.target.value=v}
 if(p==='d:govt_id_number'){v=v.toUpperCase();e.target.value=v}
 setPath(p,v);e.target.classList.remove('auto');
 if(p==='d:team_lead_id'){F.team_lead_id=v?+v:'';$('#mob').value=tl(v)?.mobile||''}
});
document.addEventListener('change',e=>{if(['d:govt_id_type','d:yatra'].includes(e.target.dataset?.p)){if(['d:govt_id_type','d:yatra'].includes(e.target.dataset.p)){const y=window.scrollY;render();scrollTo(0,y)}}});

function validate(){const E=validateRaw();for(const k of Object.keys(E)){const f=errField(k);if(f&&!can(f,'edit')){if(EDIT)delete E[k];else E[k]='You cannot enter this field. Ask the Admin for edit access'}}return E}
function validateRaw(){
 const E={};if(!F.yatra)E.yatra='Choose a Yatra';if(!F.team_lead_id)E.team_lead_id='Choose a Team Lead';if(!F.name.trim())E.name='Enter the devotee name';const a=+F.age;if(!Number.isInteger(a)||a<1||a>120)E.age='Age must be 1-120';if(!F.gender)E.gender='Choose a gender';
 if(F.govt_id_type||F.govt_id_number){if(!F.govt_id_type)E.govt_id_number='Choose the ID type';else if(!F.govt_id_number)E.govt_id_number='Enter the ID number';else if(!ID_TYPES[F.govt_id_type][0].test(F.govt_id_number.replace(/[\s-]/g,'')))E.govt_id_number='Invalid '+F.govt_id_type+'. Expected '+ID_TYPES[F.govt_id_type][1]}
 for(const s of slots()){const t=getT(s);if(t.mode==='own')continue;if(!['train_no','flight_no','pnr','journey_date','boarding_at','coach','seat','berth'].some(k=>t[k]))continue;
  if(t.mode==='flight'){if(t.flight_no&&!/^[A-Z0-9]{2} ?\d{1,4}$/.test(t.flight_no))E[s+'flight_no']='Use airline code and number, like 6E 2045';
   if(t.pnr&&!/^[A-Z0-9]{6}$/.test(t.pnr))E[s+'pnr']='Flight PNR is exactly 6 letters or digits'}
  else{if(t.train_no&&!/^\d{5}$/.test(t.train_no))E[s+'train_no']='Train number is 5 digits';
   if(t.pnr&&!/^\d{10}$/.test(t.pnr))E[s+'pnr']='PNR must be exactly 10 digits'}
  if(t.journey_date&&isNaN(new Date(t.journey_date)))E[s+'journey_date']='Use a valid date'}
 return E;
}
const FLAB={yatra:'Yatra',team_lead_id:'Team Lead',name:'Devotee',age:'Age',gender:'Gender',govt_id_number:'ID Number'},TLAB={train_no:'Train No',flight_no:'Flight No',pnr:'PNR',journey_date:'Date',seat:'Seat',own_how:'Mode of travel',boarding_at:'Boarding'};
const errLabel=k=>{if(FLAB[k])return FLAB[k];const m=k.match(/^(onward|return|\d+)([a-z_]+)$/);return m?`${m[1]==='onward'?'Onward':m[1]==='return'?'Return':'Additional'} ${TLAB[m[2]]||m[2]}`:k};
function showErrors(E){document.querySelectorAll('.em').forEach(x=>x.textContent='');document.querySelectorAll('.err').forEach(x=>x.classList.remove('err'));Object.entries(E).forEach(([k,m])=>{const el=$('#e-'+k);if(el){el.textContent=m;el.previousElementSibling?.classList.add('err')}});
 const box=$('#err-sum');if(box){const es=Object.entries(E);box.hidden=!es.length;box.innerHTML=es.length?`<b>${es.length} thing${es.length>1?'s':''} to fix before saving</b><ul>${es.map(([k,m])=>`<li><a data-goerr="${esc(k)}">${esc(errLabel(k))}</a>: ${esc(m)}</li>`).join('')}</ul>`:'';if(es.length)box.scrollIntoView({block:'start',behavior:'smooth'})}}
const clean=t=>{const{_k,...r}=t;return r};
const seatKey=x=>!x||!x.journey_date||!x.seat?null:x.mode==='flight'?(x.flight_no?`F|${x.flight_no.replace(/\s/g,'')}|${x.journey_date}|${x.seat}`:null):(x.train_no&&x.coach?`T|${x.train_no}|${x.journey_date}|${x.coach}|${x.seat}`:null);
function seatWarnings(d){const w=[],mine=[d.tickets.onward,d.tickets.return,...(d.tickets.additional||[])].filter(Boolean);
 DB.devotees.filter(o=>o.id!==d.id&&o.yatra==d.yatra&&!isCan(o)).forEach(o=>{[o.tickets.onward,o.tickets.return,...(o.tickets.additional||[])].filter(Boolean).forEach(y=>{const k=seatKey(y);if(k&&mine.some(x=>seatKey(x)===k)){const x=mine.find(m=>seatKey(m)===k);w.push(x.mode==='flight'?`Seat clash: seat ${x.seat} on flight ${x.flight_no} (${x.journey_date}) is also held by ${o.name} (${o.yatra_id})`:`Seat clash: ${x.coach}/${x.seat} on train ${x.train_no} is also held by ${o.name} (${o.yatra_id})`)}})});return [...new Set(w)]}
const hasT=t=>t&&['own_how','train_no','flight_no','airline','pnr','journey_date','boarding_at','coach','seat','berth'].some(k=>t[k]);
function persist(force){
 if(!canSaveDev()){toast('Your profile can only view',1);return}
 if(PY_SERVER&&EDIT!=null){const now=DB.devotees.find(x=>x.id===EDIT);if(!now){toast('This devotee was deleted by someone else.',1);return}if(FORM_BASE&&sj(now)!==FORM_BASE){toast('Someone else changed this devotee while you had it open. Close it and open it again to see their changes, then redo your edit.',1);return}}
 const E=validate();showErrors(E);if(Object.keys(E).length){toast('Please fix the highlighted fields',1);return}
 if(!EDIT&&!force){const same=DB.devotees.find(d=>!isCan(d)&&d.yatra==F.yatra&&d.team_lead_id==F.team_lead_id&&d.age==F.age&&sim(d.name,F.name)>=.95);if(same)return dupDialog(same)}
 const rec={...F,yatra:+F.yatra,age:+F.age,team_lead_id:+F.team_lead_id,tickets:{onward:hasT(F.tickets.onward)?F.tickets.onward:null,return:hasT(F.tickets.return)?F.tickets.return:null,additional:F.tickets.additional.filter(hasT).map(clean)}};
 [rec.tickets.onward,rec.tickets.return,...rec.tickets.additional].forEach(x=>{if(x){delete x._file;delete x.file_name}});
 if(EDIT){const i=DB.devotees.findIndex(d=>d.id===EDIT);rec.id=EDIT;rec.yatra_id=DB.devotees[i].yatra_id;DB.devotees[i]=rec}
 else{DB._deleted=DB._deleted||0;rec.id=nextId(DB);rec.yatra_id=nextYatra(DB,rec.yatra);DB.devotees.push(rec)}
 save();toast(`${rec.name} saved (${rec.yatra_id})`);seatWarnings(rec).forEach(w=>toast(w,1));PARSED={};PICK={};F=null;EDIT=null;VIEW=rec.status==='cancelled'?'cancelled':'list';render();scrollTo(0,0);
}
function dupDialog(d){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div style="max-width:420px"><h2>This devotee may already exist</h2><p><b>${esc(d.name)}</b>, age ${d.age}, is already recorded as <code>${d.yatra_id}</code>.</p><div style="display:grid;gap:8px;margin-top:12px"><button class="b pri" id="d1">Update the existing record</button><button class="b gh" id="d2">Create a separate record anyway</button><button class="b gh" id="d3">Go back</button></div></div>`;document.body.appendChild(m);
 $('#d1',m).onclick=()=>{const i=DB.devotees.findIndex(x=>x.id===d.id);const o=DB.devotees[i];['accommodation','room_no','bus_no','govt_id_type','govt_id_number','darshan'].forEach(k=>{if(F[k])o[k]=F[k]});if(hasT(F.tickets.onward))o.tickets.onward=F.tickets.onward;if(hasT(F.tickets.return))o.tickets.return=F.tickets.return;o.tickets.additional.push(...F.tickets.additional.filter(hasT).map(clean));save();m.remove();toast('Updated existing record '+o.yatra_id);F=null;VIEW='list';render()};
 $('#d2',m).onclick=()=>{m.remove();persist(true)};$('#d3',m).onclick=()=>m.remove()}

/* ---------------- ticket upload + passenger flow ---------------- */
function applyPassenger(p,manual){if(manual||!F.name){F.name=p.name}if(p.age&&(manual||!F.age))F.age=String(p.age);if(p.gender&&(manual||!F.gender))F.gender=p.gender;['name','age','gender'].forEach(k=>AUTO['d:'+k]=1)}
function fillSeat(s,p){const t=getT(s);Object.assign(t,{coach:p.coach,seat:p.seat,berth:p.berth});['coach','seat','berth'].forEach(k=>{if(p[k])AUTO[`t:${s}:${k}`]=1;else delete AUTO[`t:${s}:${k}`]})}
async function handleFile(s,file){
 if(!file)return;const st=$('#st-'+s);if(file.size>10*1048576){st.innerHTML='<div class="note bad">File is larger than 10 MB.</div>';return}
 st.innerHTML=`<div style="margin-top:10px"><span class="spin"></span> Reading ${esc(file.name)}…</div>`;
 const t=getT(s);t.file_name=file.name;t._file=file;
 try{
  const p=await readTicket(file);PARSED[s]=p;
  let idx=null;if(p.passengers.length){if(F.name.trim()){const b=bestMatch(F.name,+F.age,p.passengers.map((x,i)=>({id:i,name:x.name,age:x.age})));idx=b?b.c.id:null}else idx=0}
  PICK[s]=idx;
  t.mode=p.mode==='flight'?'flight':'train';delete OTHER['b'+s];
  if(t.mode==='flight'){Object.assign(t,{flight_no:p.flight_no,airline:p.airline,dep_time:p.dep_time,pnr:p.pnr,journey_date:p.journey_date,boarding_at:p.boarding_at,train_no:'',coach:'',berth:''});['flight_no','airline','dep_time','pnr','journey_date','boarding_at'].forEach(k=>{if(t[k])AUTO[`t:${s}:${k}`]=1})}
  else{Object.assign(t,{train_no:p.train_no,train_name:p.train_name,pnr:p.pnr,journey_date:p.journey_date,boarding_at:p.boarding_at});['train_no','pnr','journey_date','boarding_at'].forEach(k=>{if(t[k])AUTO[`t:${s}:${k}`]=1})}
  if(idx!=null){fillSeat(s,p.passengers[idx]);applyPassenger(p.passengers[idx],false)}
  const y=scrollY;render();
  const el=$(`[data-slot="${s}"] .pp`);el?.scrollIntoView({behavior:'smooth',block:'start'});
  const box=$('#st-'+s);if(p.low||p.warnings.length)box.innerHTML=`<div class="note warn"><b>${p.low?'Low confidence. Check every field before saving.':'Check these before saving:'}</b><ul style="margin:4px 0 0 18px;padding:0">${p.warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></div>`;
  toast(p.low?'Read with low confidence. Check every field':'Ticket read. Check the highlighted fields',p.low);
 }catch(err){render();$('#st-'+s).innerHTML=`<div class="note bad"><b>We could not read this ticket.</b><br>${esc(err.message)}<br>The file is attached. Fill the fields below manually, or upload a clearer copy.</div>`}
}
document.addEventListener('click',e=>{
 const g=a=>e.target.closest(`[${a}]`)?.getAttribute(a)??null;
 let v;
 if((v=g('data-up'))!==null)$(`[data-file="${v}"]`).click();
 else if((v=g('data-cam'))!==null)$(`[data-camfile="${v}"]`).click();
 else if((v=g('data-rmslot'))!==null){e.preventDefault();F.tickets.additional=F.tickets.additional.filter(t=>String(t._k)!==v);render()}
 else if((v=g('data-rmfile'))!==null){e.preventDefault();const t=getT(isNaN(v)?v:+v);t.file_name='';t._file=null;delete PARSED[v];render()}
 else if((v=g('data-view'))!==null){e.preventDefault();const t=getT(isNaN(v)?v:+v);window.open(URL.createObjectURL(t._file),'_blank')}
 else if((v=g('data-blist'))!==null){e.preventDefault();delete OTHER['b'+v];const y=scrollY;render();scrollTo(0,y)}
 else if((v=g('data-trlist'))!==null){e.preventDefault();delete OTHER[v];const t=getT(isNaN(v)?v:+v);const x=DB.trains.find(y=>y.no===t.train_no);t.train_name=x?x.name:'';const y=scrollY;render();scrollTo(0,y)}
 else if(e.target.id==='addtk'){F.tickets.additional.push({...emptyT(),_k:K++});render()}
 else if(e.target.id==='save')persist(false);
 else if(e.target.id==='cancel'){F=null;EDIT=null;VIEW='list';render()}
 else if(e.target.id==='del'){const yid=DB.devotees.find(d=>d.id===EDIT)?.yatra_id;ask(`Delete ${F.name}?`,`This removes the devotee and their tickets. The Yatra ID ${yid} will never be given to anyone else.`,'Delete devotee',()=>{DB.devotees=DB.devotees.filter(d=>d.id!==EDIT);DB._deleted=(DB._deleted||0)+1;save();toast('Deleted. '+yid+' will not be reused');F=null;EDIT=null;VIEW='list';render();scrollTo(0,0)})}
 else if((v=g('data-bulk'))!==null)bulkDialog(isNaN(v)?v:+v);
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b)return;const[s,m]=b.dataset.mode.split(':'),sl=isNaN(s)?s:+s,t=getT(sl);if(!t||t.mode===m||(m==='train'&&!t.mode))return;
 t.mode=m;['pnr','boarding_at','coach','berth','seat','own_how','own_note','dep_time'].forEach(k=>{t[k]='';delete AUTO[`t:${sl}:${k}`]});delete OTHER['b'+s];delete PARSED[sl];PICK[sl]=null;const y=scrollY;render();scrollTo(0,y)});
document.addEventListener('change',e=>{
 if(e.target.dataset?.reptl!==undefined){REPTL=e.target.value;render();return}
 if(e.target.dataset?.reptrain!==undefined){REPTRAIN=e.target.value;render();return}
 if(e.target.dataset?.repdate!==undefined){REPDATE=e.target.value;render();return}
 if(e.target.dataset?.repbus!==undefined){REPBUS=e.target.value;render();return}
 if(e.target.dataset?.repacc!==undefined){REPACC=e.target.value;render();return}
 const bd=e.target.dataset?.board;if(bd!==undefined){const s=isNaN(bd)?bd:+bd,t=getT(s),v=e.target.value;
  if(v==='__other'){OTHER['b'+bd]=true;t.boarding_at=''}else t.boarding_at=v;
  delete AUTO[`t:${s}:boarding_at`];const y=scrollY;render();scrollTo(0,y);return}
 if(e.target.id==='ysel'){CUR=e.target.value;DSEL=null;DSELSET.clear();localStorage.setItem('py_cur',CUR);render();return}
 const tr=e.target.dataset?.train;if(tr!==undefined){const s=isNaN(tr)?tr:+tr,t=getT(s),v=e.target.value;
  if(v==='__other'){OTHER[tr]=true;t.train_no='';t.train_name=''}
  else{const x=DB.trains.find(y=>y.no===v);t.train_no=v;t.train_name=x?x.name:(v===t.train_no?t.train_name:'')}
  delete AUTO[`t:${s}:train_no`];const y=scrollY;render();scrollTo(0,y);return}
 const f=e.target.dataset?.file??e.target.dataset?.camfile;if(f!==undefined){handleFile(isNaN(f)?f:+f,e.target.files[0]);e.target.value=''}
 const pk=e.target.dataset?.pick;if(pk){const[s,i]=pk.split(':');const sl=isNaN(s)?s:+s;PICK[sl]=+i;const p=PARSED[sl].passengers[+i];fillSeat(sl,p);applyPassenger(p,true);const y=scrollY;render();scrollTo(0,y)}
});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{const d=e.target.closest?.('[data-drop]');if(!d)return;e.preventDefault();d.classList.toggle('over',ev==='dragover');if(ev==='drop'){const s=d.dataset.drop;handleFile(isNaN(s)?s:+s,e.dataTransfer.files[0])}}));

function bulkDialog(s){
 if(!F.yatra){toast('Choose a Yatra first',1);return}if(!F.team_lead_id){toast('Choose a Team Lead first',1);return}
 const P=PARSED[s],t=getT(s),cands=DB.devotees.filter(d=>!isCan(d)&&d.yatra==F.yatra&&d.team_lead_id==F.team_lead_id),taken=new Set();
 const maps=P.passengers.map(p=>{const b=bestMatch(p.name,p.age,cands.filter(c=>!taken.has(c.id)));if(b)taken.add(b.c.id);return b?{a:'u',id:b.c.id,hit:1}:{a:'c'}});
 const type=s==='onward'||s==='return'?s:'additional';
 const m=document.createElement('div');m.className='modal';
 m.innerHTML=`<div><h2>Create records from this ${type} ticket</h2><p class="hint" style="font-size:14px;margin:6px 0 10px">Each passenger gets their own record with their own coach, seat and berth. Names already in this Team Lead's group are matched (case and initials ignored) so ${type==='onward'?'no duplicates are made':'this ticket lands on the same record as the onward ticket'}. Change any row if the match is wrong.</p><div class="tw"><table><thead><tr><th>Passenger</th><th>Seat</th><th>What to do</th></tr></thead><tbody>
 ${P.passengers.map((p,i)=>`<tr><td><b>${esc(p.name)}</b><div class="hint">${p.age||'age ?'} / ${p.gender||'sex ?'}</div>${!p.age||!p.gender?`<div style="display:flex;gap:6px;margin-top:4px">${!p.age?`<input data-bage="${i}" type="number" min="1" max="120" placeholder="Age" style="width:80px;min-height:34px">`:''}${!p.gender?`<select data-bgen="${i}" style="width:100px;min-height:34px"><option value="">Sex</option><option>Male</option><option>Female</option></select>`:''}</div>`:''}</td><td>${esc([p.coach,p.seat,p.berth].filter(Boolean).join(' / '))||'<span class="hint">not allotted</span>'}</td><td><select data-m="${i}"><option value="c" ${maps[i].a==='c'?'selected':''}>Create a new devotee record</option>${cands.map(c=>`<option value="${c.id}" ${maps[i].id===c.id?'selected':''}>${sim(p.name,c.name)>=.72?'✓ ':''}Update ${esc(c.name)} (${c.yatra_id})</option>`).join('')}<option value="s">Skip this passenger</option></select></td></tr>`).join('')}</tbody></table></div>
 <div class="em" id="bulk-err"></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="b gh" id="bc">Cancel</button><button class="b pri" id="bs">Save records</button></div></div>`;
 document.body.appendChild(m);$('#bc',m).onclick=()=>m.remove();
 $('#bs',m).onclick=()=>{
  const res=[],warn=[],AG=P.passengers.map((p,i)=>p.age||+($(`[data-bage="${i}"]`,m)?.value)||0),GN=P.passengers.map((p,i)=>p.gender||$(`[data-bgen="${i}"]`,m)?.value||'');
  const bad=P.passengers.findIndex((p,i)=>$(`[data-m="${i}"]`,m).value==='c'&&(!(AG[i]>=1&&AG[i]<=120)||!GN[i]));
  if(bad>=0){$('#bulk-err',m).textContent=`Enter the age and sex for ${P.passengers[bad].name}. The ticket does not show them.`;return}
  P.passengers.forEach((p,i)=>{const v=$(`[data-m="${i}"]`,m).value;if(v==='s')return;
   const tk={...clean(t),coach:p.coach,seat:p.seat,berth:p.berth,booking_status:p.booking_status};delete tk._file;delete tk.file_name;
   if(v==='c'){const d={id:nextId(DB),yatra:+F.yatra,yatra_id:nextYatra(DB,+F.yatra),team_lead_id:+F.team_lead_id,name:p.name,age:AG[i],gender:GN[i],accommodation:'',room_no:'',bus_no:'',govt_id_type:'',govt_id_number:'',darshan:'',tickets:{onward:null,return:null,additional:[]}};if(type==='additional')d.tickets.additional.push(tk);else d.tickets[type]=tk;DB.devotees.push(d);res.push([p.name,d.yatra_id,'created']);warn.push(...seatWarnings(d))}
   else{const d=DB.devotees.find(x=>x.id==v);if(type==='additional')d.tickets.additional.push(tk);else d.tickets[type]={...(d.tickets[type]||{}),...tk};res.push([p.name,d.yatra_id,'updated']);warn.push(...seatWarnings(d))}});
  save();m.innerHTML=`<div style="max-width:460px"><h2>Records saved</h2><table>${res.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td style="font:12px monospace">${r[1]}</td><td><span class="chip ${r[2]==='created'?'g':''}">${r[2]}</span></td></tr>`).join('')}</table>${[...new Set(warn)].map(w=>`<div class="note warn">${esc(w)}</div>`).join('')}<div style="text-align:right;margin-top:12px"><button class="b pri" id="bd">View devotees</button></div></div>`;
  $('#bd',m).onclick=()=>{m.remove();F=null;EDIT=null;VIEW='list';render()};
 };
}
boot();
